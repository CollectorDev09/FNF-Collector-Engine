name: collector-engine-build
on: [push]
jobs:
  buildWindows:
    runs-on: windows-latest

    steps:
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: '4.3.7'

      - run: haxelib setup C:/haxelib
      - run: haxelib install hxcpp
      - run: haxelib install hscript
      - run: haxelib install lime
      - run: haxelib install openfl
      - run: haxelib install flixel
      - run: haxelib set flixel 6.2.0
      - run: haxelib set openfl 9.5.2
      - run: haxelib set lime 8.3.2
      - run: haxelib run lime setup flixel
      - run: haxelib run lime setup
      - run: haxelib run lime test windows